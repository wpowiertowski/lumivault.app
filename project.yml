name: LumiVault
options:
  bundleIdPrefix: app.lumivault
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    PRODUCT_NAME: LumiVault
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
    ARCHS: arm64
    VALID_ARCHS: arm64

schemes:
  LumiVault:
    build:
      targets:
        LumiVault: all
        LumiVaultTests: [test]
        LumiVaultUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumiVaultTests
        - LumiVaultUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  LumiVault:
    type: application
    platform: macOS
    sources:
      - path: LumiVault
        excludes:
          - "**/*.entitlements"
          - Info.plist
          - Resources/LumiVault.help
          - Resources/AppIcon.icon
      - path: LumiVault/Resources/LumiVault.help
        type: folder
        buildPhase: resources
      - path: LumiVault/Resources/AppIcon.icon
        buildPhase: resources
    settings:
      base:
        # MainActor-by-default isolation for the app target (mirrors Package.swift's
        # `.defaultIsolation(MainActor)`, which SwiftPM applies to the LumiVault
        # target only). IMPORTANT: the `SWIFT_DEFAULT_ISOLATION` build setting is
        # silently ignored by this Xcode/toolchain — it never reaches the compiler
        # as `-default-isolation` (verified in the build log) — so without the
        # explicit OTHER_SWIFT_FLAGS below the app builds with a *nonisolated*
        # default. Code written for MainActor (e.g. SwiftData mutations in the
        # import/sync coordinators) then runs OFF the main actor, corrupting the
        # main-bound ModelContext and crashing with EXC_BAD_ACCESS in @Query /
        # relationship reads. Scoped to the app target: the test targets rely on
        # the default (nonisolated) isolation (URLProtocol stubs, XCTestCase).
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS: "$(inherited) -default-isolation MainActor"
        INFOPLIST_FILE: LumiVault/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.lumivault
        DEVELOPMENT_TEAM: 6AS496S47T
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        ICLOUD_CONTAINER_ENVIRONMENT: Production
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_ENTITLEMENTS: LumiVault/LumiVault.Debug.entitlements
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          CODE_SIGN_ENTITLEMENTS: LumiVault/LumiVault.entitlements
  LumiVaultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_NAME: LumiVaultTests
        PRODUCT_MODULE_NAME: LumiVaultTests
    dependencies:
      - target: LumiVault
  LumiVaultUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_NAME: LumiVaultUITests
        PRODUCT_MODULE_NAME: LumiVaultUITests
    dependencies:
      - target: LumiVault
